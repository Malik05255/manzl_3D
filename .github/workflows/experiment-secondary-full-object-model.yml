name: Secondary Full Object Model Benchmark

on:
  push:
    branches: [exp/secondary-full-object-model]
    paths:
      - .github/workflows/experiment-secondary-full-object-model.yml
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [4, 9, 13, 14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt

      - name: Install analyzer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          python -m pip install --upgrade pip
          pip install -r services/analyzer/requirements.txt pytest shapely

      - name: Run symbol regressions
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_symbols.py

      - name: Download production FloorCAD model
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35775467616
          name: floorcad-onnx-33138ab67ee6e77c50b3f85354dc821cb21b2c0e
          path: models/primary

      - name: Download full custom secondary model
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35771807959
          name: synthetic-object-model-ce173f1610d70efb74b1c49c1c72ed137d04e57a
          path: models/secondary

      - name: Configure calibrated full secondary detector
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          primary_info=json.loads(
              Path("models/primary/symbol-model-info.json").read_text()
          )
          secondary_classes=json.loads(
              Path("models/secondary/synthetic-model/classes.json").read_text()
          )

          thresholds={
              "single_swing_door":0.30,
              "toilet":0.70,
              "bathtub":0.50,
              "shower":0.50,
              "cooktop":0.70,
              "sink":0.10,
          }

          with Path(os.environ["GITHUB_ENV"]).open("a",encoding="utf-8") as env:
              env.write(
                  "SYMBOL_ONNX_MODEL="
                  +str(Path("models/primary/floorcad-symbols.onnx").resolve())
                  +"\n"
              )
              env.write(
                  "SYMBOL_ONNX_CLASSES="
                  +json.dumps(primary_info["classes"],separators=(",",":"))
                  +"\n"
              )
              env.write("SYMBOL_MIN_CONFIDENCE=0.55\n")
              env.write("SYMBOL_SINK_MIN_CONFIDENCE=0.10\n")
              env.write(
                  "SYMBOL_SECONDARY_ONNX_MODEL="
                  +str(
                      Path(
                          "models/secondary/synthetic-model/synthetic-objects.onnx"
                      ).resolve()
                  )
                  +"\n"
              )
              env.write(
                  "SYMBOL_SECONDARY_ONNX_CLASSES="
                  +json.dumps(secondary_classes,separators=(",",":"))
                  +"\n"
              )
              env.write("SYMBOL_SECONDARY_ONNX_RAW_MIN_CONFIDENCE=0.10\n")
              env.write(
                  "SYMBOL_SECONDARY_ONNX_ALLOWED_CLASSES="
                  "single_swing_door,toilet,bathtub,shower,cooktop,sink\n"
              )
              env.write(
                  "SYMBOL_SECONDARY_ONNX_CLASS_THRESHOLDS="
                  +json.dumps(thresholds,separators=(",",":"))
                  +"\n"
              )
              env.write("SYMBOL_SECONDARY_ONNX_TILE_TRIGGER=640\n")
              env.write("SYMBOL_SECONDARY_ONNX_TILE_SIZE=640\n")
              env.write("SYMBOL_SECONDARY_ONNX_TILE_OVERLAP=0.25\n")
              env.write("SYMBOL_SECONDARY_ONNX_NMS_IOU=0.45\n")
              env.write("PDF_NATIVE_TEXT_FASTPATH=1\n")

          print("thresholds",thresholds)
          PY

      - name: Run representative AEC sheet
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: |
          mkdir -p "../../benchmark-output/full-secondary-${{ matrix.shard }}"
          python -m app.aec_benchmark             --dataset ../../external/aec-geometric-bench/dataset             --output "../../benchmark-output/full-secondary-${{ matrix.shard }}"             --offset "${{ matrix.shard }}"             --limit 1

      - uses: actions/upload-artifact@v4
        with:
          name: full-secondary-${{ matrix.shard }}-${{ github.sha }}
          path: |
            benchmark-output/full-secondary-${{ matrix.shard }}/*.json
            benchmark-output/full-secondary-${{ matrix.shard }}/_canonical/*.json
            benchmark-output/full-secondary-${{ matrix.shard }}/_timings/*.json
          if-no-files-found: error
          retention-days: 5

  score:
    if: always()
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/analyzer/requirements.txt shapely

      - uses: actions/download-artifact@v4
        with:
          pattern: full-secondary-*-${{ github.sha }}
          path: benchmark-output/dual
          merge-multiple: true

      - name: Download baseline sheet 05
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35775467616
          name: aec-shard-4-33138ab67ee6e77c50b3f85354dc821cb21b2c0e
          path: benchmark-output/baseline
      - name: Download baseline sheet 10
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35775467616
          name: aec-shard-9-33138ab67ee6e77c50b3f85354dc821cb21b2c0e
          path: benchmark-output/baseline
      - name: Download baseline sheet 14
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35775467616
          name: aec-shard-13-33138ab67ee6e77c50b3f85354dc821cb21b2c0e
          path: benchmark-output/baseline
      - name: Download baseline sheet 15
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35775467616
          name: aec-shard-14-33138ab67ee6e77c50b3f85354dc821cb21b2c0e
          path: benchmark-output/baseline

      - name: Score full secondary against baseline subset
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from app.aec_benchmark import run_official_scorer

          root=Path("../..")
          dataset=root/"external/aec-geometric-bench/dataset"
          scorer=root/"external/aec-geometric-bench/scoring/score.py"
          sheets=["sheet_05","sheet_10","sheet_14","sheet_15"]
          reports={}

          for name,path in (
              ("baseline",root/"benchmark-output/baseline"),
              ("full",root/"benchmark-output/dual"),
          ):
              code,output,report=run_official_scorer(
                  scorer,path,dataset,sheet_names=sheets,include_per_sheet=True,
              )
              print(f"=== {name.upper()} ===")
              print(output)
              if code!=0 or report is None:
                  raise SystemExit(code or 1)
              reports[name]=report

          target=root/"benchmark-output/full-secondary-compare"
          target.mkdir(exist_ok=True)
          (target/"report.json").write_text(
              json.dumps(reports,ensure_ascii=False,indent=2),
              encoding="utf-8",
          )

          classes=[
              "Single Swing Door","Double Swing Door","Window","Sink",
              "Toilet","Bathtub","Shower","Cooktops",
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## Full secondary model vs baseline\n\n")
              out.write("| Class | Baseline F1 | Full secondary F1 | ΔF1 |\n")
              out.write("|---|---:|---:|---:|\n")
              for cls in classes:
                  base=reports["baseline"].get("classes",{}).get(cls,{})
                  full=reports["full"].get("classes",{}).get(cls,{})
                  bf=float(base.get("f1",0))
                  ff=float(full.get("f1",0))
                  out.write(f"| {cls} | {bf:.3f} | {ff:.3f} | {ff-bf:+.3f} |\n")
              out.write(
                  f"\nBaseline Object F1: "
                  f"{float(reports['baseline'].get('objectMicro',{}).get('f1',0)):.4f}\n"
              )
              out.write(
                  f"Full secondary Object F1: "
                  f"{float(reports['full'].get('objectMicro',{}).get('f1',0)):.4f}\n"
              )
              out.write(
                  f"Baseline macroF1: {float(reports['baseline'].get('macroF1',0)):.4f}\n"
              )
              out.write(
                  f"Full secondary macroF1: {float(reports['full'].get('macroF1',0)):.4f}\n"
              )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: full-secondary-score-${{ github.sha }}
          path: benchmark-output/full-secondary-compare/report.json
          retention-days: 7
