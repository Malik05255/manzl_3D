name: Synthetic ONNX Self Check

on:
  push:
    branches: [exp/synthetic-object-detector-fast-v2]
    paths:
      - .github/workflows/experiment-synthetic-onnx-selfcheck.yml
  workflow_dispatch:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/analyzer/requirements.txt
          pip install "ultralytics==8.3.249" "pyyaml>=6,<7"

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35772651346
          name: synthetic-object-model-3110e7f36bdee04e45278c7d2da5046fc8e83058
          path: synthetic-model-artifact

      - name: Generate fresh synthetic validation set
        working-directory: services/analyzer
        run: |
          python tools/generate_synthetic_symbol_dataset.py             --output ../../synthetic-selfcheck             --train 8             --val 24             --size 320             --seed 240923

      - name: Compare raw ONNX output and OpenCV decoder
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import cv2
          import numpy as np
          import app.symbols as symbols

          root=Path("../..")
          model=root/"synthetic-model-artifact/synthetic-model/synthetic-objects.onnx"
          classes=json.loads(
              (root/"synthetic-model-artifact/synthetic-model/classes.json").read_text()
          )
          os.environ["SYMBOL_ONNX_MODEL"]=str(model)
          os.environ["SYMBOL_ONNX_CLASSES"]=json.dumps(classes,separators=(",",":"))
          os.environ["SYMBOL_ONNX_INPUT_SIZE"]="640"
          os.environ["SYMBOL_ONNX_RAW_MIN_CONFIDENCE"]="0.01"
          os.environ["SYMBOL_ONNX_TILE_TRIGGER"]="1800"

          net=cv2.dnn.readNetFromONNX(str(model))
          sample=next((root/"synthetic-selfcheck/images/val").glob("*.png"))
          image=cv2.imread(str(sample))
          boxed,scale,pad_x,pad_y=symbols._letterbox(image,640)
          blob=cv2.dnn.blobFromImage(
              boxed,1/255.0,(640,640),swapRB=True,crop=False,
          )
          net.setInput(blob)
          raw=net.forward()
          rows=symbols._prepare_yolo_rows(raw,len(classes))
          print("RAW_SHAPE",list(raw.shape))
          print("ROWS_SHAPE",list(rows.shape))
          if rows.size:
              scores=rows[:,4:] if rows.shape[1]==4+len(classes) else rows[:,5:]
              print("RAW_SCORE_MAX",float(np.max(scores)) if scores.size else -1)
              print("RAW_SCORE_P99",float(np.quantile(scores,.99)) if scores.size else -1)

          decoded_total=0
          per_image=[]
          for path in sorted((root/"synthetic-selfcheck/images/val").glob("*.png")):
              img=cv2.imread(str(path))
              detections=symbols.extract_local_onnx_detections(img)
              decoded_total+=len(detections)
              per_image.append({
                  "image":path.name,
                  "detections":len(detections),
                  "classes":sorted({str(d.get("class")) for d in detections}),
                  "maxConfidence":max(
                      (float(d.get("confidence",0)) for d in detections),
                      default=0.0,
                  ),
              })
          result={
              "classes":classes,
              "rawShape":list(raw.shape),
              "rowsShape":list(rows.shape),
              "decodedTotal":decoded_total,
              "perImage":per_image,
          }
          target=root/"benchmark-output/synthetic-onnx-selfcheck.json"
          target.parent.mkdir(exist_ok=True)
          target.write_text(json.dumps(result,indent=2),encoding="utf-8")
          print("DECODED_TOTAL",decoded_total)
          print("SELF_CHECK",json.dumps(result,sort_keys=True))
          if decoded_total==0:
              raise SystemExit("ONNX decoder produced zero detections on synthetic validation")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-onnx-selfcheck-${{ github.sha }}
          path: benchmark-output/synthetic-onnx-selfcheck.json
          if-no-files-found: warn
          retention-days: 5
