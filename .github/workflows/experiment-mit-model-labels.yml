name: MIT Floor Plan Model Labels

on:
  push:
    branches: [exp/mit-model-labels]
    paths:
      - .github/workflows/experiment-mit-model-labels.yml
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model tooling
        run: |
          python -m pip install --upgrade pip
          pip install "ultralytics==8.3.249"
      - name: Download MIT project checkpoint
        run: |
          python - <<'PY'
          import urllib.request
          url="https://github.com/sanatladkat/floor-plan-object-detection/raw/refs/heads/main/best.pt"
          urllib.request.urlretrieve(url,"best.pt")
          PY
      - name: Inspect checkpoint labels
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from ultralytics import YOLO

          model=YOLO("best.pt")
          names=[str(model.names[index]) for index in sorted(model.names)]
          targets={"sink","toilet","bathtub","bath","shower","cooktop","stove","gas stove"}
          normalized={" ".join(name.lower().replace("_"," ").replace("-"," ").split()) for name in names}
          fixture_labels=sorted(
              name for name in normalized
              if any(target in name for target in targets)
          )
          result={"classes":names,"fixtureLabels":fixture_labels}
          Path("benchmark-output").mkdir(exist_ok=True)
          Path("benchmark-output/mit-model-labels.json").write_text(
              json.dumps(result,indent=2),encoding="utf-8"
          )
          print("MODEL_CLASSES",json.dumps(names))
          print("FIXTURE_LABELS",json.dumps(fixture_labels))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## MIT floor-plan checkpoint labels\n\n")
              out.write(f"- classes: {', '.join(names)}\n")
              out.write(f"- relevant fixture labels: {', '.join(fixture_labels) if fixture_labels else 'none'}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mit-model-labels-${{ github.sha }}
          path: benchmark-output/mit-model-labels.json
          retention-days: 3
