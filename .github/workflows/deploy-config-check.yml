name: Deployment Configuration Check

on:
  push:
    branches: [exp/deploy-config-check]
    paths:
      - .github/workflows/deploy-config-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MANZIL_INTERNAL_TOKEN: ${{ secrets.MANZIL_INTERNAL_TOKEN }}
      MANZIL_D1_DATABASE_ID: ${{ vars.MANZIL_D1_DATABASE_ID }}
      MANZIL_ANALYZER_URL: ${{ vars.MANZIL_ANALYZER_URL }}
      MANZIL_API_PUBLIC_URL: ${{ vars.MANZIL_API_PUBLIC_URL }}
      MANZIL_WEB_ORIGIN: ${{ vars.MANZIL_WEB_ORIGIN }}
      MANZIL_PAGES_PROJECT: ${{ vars.MANZIL_PAGES_PROJECT }}
    steps:
      - name: Check required deployment settings
        shell: bash
        run: |
          set -eu
          missing=0
          check() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              echo "PRESENT $name"
            else
              echo "MISSING $name"
              missing=$((missing+1))
            fi
          }

          check CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          check CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          check MANZIL_INTERNAL_TOKEN "$MANZIL_INTERNAL_TOKEN"
          check MANZIL_D1_DATABASE_ID "$MANZIL_D1_DATABASE_ID"
          check MANZIL_ANALYZER_URL "$MANZIL_ANALYZER_URL"
          check MANZIL_API_PUBLIC_URL "$MANZIL_API_PUBLIC_URL"
          check MANZIL_WEB_ORIGIN "$MANZIL_WEB_ORIGIN"
          check MANZIL_PAGES_PROJECT "$MANZIL_PAGES_PROJECT"

          {
            echo "## Deployment configuration"
            echo
            if [ "$missing" -eq 0 ]; then
              echo "All required deployment Secrets/Variables are configured."
            else
              echo "$missing required deployment setting(s) are missing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
