name: Bath Shower Mapping Diagnostics

on:
  push:
    branches: [exp/bath-shower-mapping]
    paths:
      - .github/workflows/experiment-bath-shower-mapping.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          python -m pip install --upgrade pip
          pip install -r services/analyzer/requirements.txt
          pip install "ultralytics==8.3.249" "huggingface_hub>=0.34,<1" "onnx>=1.17,<2"
      - name: Export FloorCAD ONNX
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          from ultralytics import YOLO
          source=hf_hub_download(
              "mudasir13cs/floorcad-yolov8n-detect",
              "floorcad-yolov8n-detect.pt",
          )
          model=YOLO(source)
          exported=model.export(format="onnx",imgsz=640,opset=12,simplify=False,dynamic=False)
          target=Path("benchmark-model"); target.mkdir(exist_ok=True)
          shutil.copy2(exported,target/"floorcad.onnx")
          classes=[str(model.names[index]) for index in sorted(model.names)]
          (target/"classes.json").write_text(json.dumps(classes),encoding="utf-8")
          PY
      - name: Measure bath taxonomy mappings
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
          SYMBOL_ONNX_MODEL: ../../benchmark-model/floorcad.onnx
          SYMBOL_ONNX_RAW_MIN_CONFIDENCE: "0.10"
        run: |
          python - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from collections import defaultdict
          from pathlib import Path

          from app.document import decode_document_with_page
          from app.symbols import extract_local_onnx_detections

          root=Path("../..")
          dataset=root/"external/aec-geometric-bench/dataset"
          classes=json.loads((root/"benchmark-model/classes.json").read_text())
          os.environ["SYMBOL_ONNX_CLASSES"]=json.dumps(classes,separators=(",",":"))
          manifest=json.loads((dataset/"manifest.json").read_text())
          xml=ET.parse(dataset/"annotations_15_scoring_ready.xml").getroot()
          images={Path(str(node.get("name"))).stem:node for node in xml.findall("image")}

          def norm(value):
              return " ".join(str(value or "").strip().lower().replace("_"," ").replace("-"," ").split())

          def iou(a,b):
              ax1,ay1,ax2,ay2=a; bx1,by1,bx2,by2=b
              iw=max(0.0,min(ax2,bx2)-max(ax1,bx1))
              ih=max(0.0,min(ay2,by2)-max(ay1,by1))
              inter=iw*ih
              if inter<=0: return 0.0
              aa=max(0.0,ax2-ax1)*max(0.0,ay2-ay1)
              bb=max(0.0,bx2-bx1)*max(0.0,by2-by1)
              return inter/max(1e-9,aa+bb-inter)

          raw_by_sheet={}
          gt_by_sheet={}
          for item in manifest["sheets"]:
              sheet=str(item["sheet"])
              data=(dataset/str(item["pdf"])).read_bytes()
              image,_=decode_document_with_page(data,"application/pdf")
              h,w=image.shape[:2]
              sx=w/float(item["width"]); sy=h/float(item["height"])

              gt=defaultdict(list)
              for box in images[sheet].findall("box"):
                  label=str(box.get("label") or "")
                  if label not in {"Shower","Bathtub"}: continue
                  gt[label].append([
                      float(box.get("xtl"))*sx,float(box.get("ytl"))*sy,
                      float(box.get("xbr"))*sx,float(box.get("ybr"))*sy,
                  ])
              gt_by_sheet[sheet]=gt

              raw=[]
              for det in extract_local_onnx_detections(image):
                  source=norm(det.get("class"))
                  if source not in {"bath","bath tub"}:
                      continue
                  raw.append({
                      "source":source,
                      "confidence":float(det.get("confidence",0.0)),
                      "bbox":list(map(float,det["bbox"])),
                  })
              raw_by_sheet[sheet]=raw
              print(sheet,"bath detections",len(raw),"gt shower",len(gt["Shower"]),"gt bathtub",len(gt["Bathtub"]))

          thresholds=[.10,.15,.20,.25,.30,.35,.40,.45,.50]
          mappings=[
              ("bath","Shower"),
              ("bath","Bathtub"),
              ("bath tub","Bathtub"),
              ("bath tub","Shower"),
          ]
          result={}
          for source,target in mappings:
              key=f"{source}->{target}"
              result[key]={}
              for threshold in thresholds:
                  tp=fp=fn=0
                  for item in manifest["sheets"]:
                      sheet=str(item["sheet"])
                      preds=[d for d in raw_by_sheet[sheet] if d["source"]==source and d["confidence"]>=threshold]
                      truths=list(gt_by_sheet[sheet][target])
                      pairs=[]
                      for pi,p in enumerate(preds):
                          for gi,g in enumerate(truths):
                              score=iou(p["bbox"],g)
                              if score>=.50: pairs.append((score,pi,gi))
                      pairs.sort(reverse=True)
                      used_p=set(); used_g=set(); matched=0
                      for score,pi,gi in pairs:
                          if pi in used_p or gi in used_g: continue
                          used_p.add(pi); used_g.add(gi); matched+=1
                      tp+=matched; fp+=len(preds)-matched; fn+=len(truths)-matched
                  precision=tp/(tp+fp) if tp+fp else 0.0
                  recall=tp/(tp+fn) if tp+fn else 0.0
                  f1=2*precision*recall/(precision+recall) if precision+recall else 0.0
                  result[key][f"{threshold:.2f}"]={
                      "tp":tp,"fp":fp,"fn":fn,
                      "precision":round(precision,4),
                      "recall":round(recall,4),
                      "f1":round(f1,4),
                  }

          target=root/"benchmark-output/bath-shower-mapping.json"
          target.parent.mkdir(exist_ok=True)
          target.write_text(json.dumps(result,indent=2),encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## Bath / Shower taxonomy sweep\n\n")
              out.write("| Mapping | Best threshold | TP | FP | FN | F1 |\n")
              out.write("|---|---:|---:|---:|---:|---:|\n")
              for key,values in result.items():
                  best=max(values.items(),key=lambda item:item[1]["f1"])
                  row=best[1]
                  out.write(
                      f"| {key} | {best[0]} | {row['tp']} | {row['fp']} | "
                      f"{row['fn']} | {row['f1']:.3f} |\n"
                  )
                  print(key,best)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bath-shower-mapping-${{ github.sha }}
          path: benchmark-output/bath-shower-mapping.json
          retention-days: 5
