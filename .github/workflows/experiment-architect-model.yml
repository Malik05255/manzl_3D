name: Architect Model Experiment

on:
  push:
    branches: [exp/architect-model]
    paths:
      - .github/workflows/experiment-architect-model.yml
  workflow_dispatch:

jobs:
  prepare-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ultralytics==8.3.249" "huggingface_hub>=0.34,<1" "onnx>=1.17,<2"
      - name: Export Architect checkpoint to ONNX
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from ultralytics import YOLO

          model=YOLO("SamirShabani/Architect")
          exported=model.export(format="onnx",imgsz=640,opset=12,simplify=False,dynamic=False)
          target=Path("benchmark-model")
          target.mkdir(exist_ok=True)
          shutil.copy2(exported,target/"architect.onnx")
          classes=[str(model.names[index]) for index in sorted(model.names)]
          (target/"model-info.json").write_text(
              json.dumps({
                  "source":"SamirShabani/Architect",
                  "license":"CC-BY-NC-4.0",
                  "classes":classes,
              },indent=2),
              encoding="utf-8",
          )
          print(classes)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: architect-model-${{ github.sha }}
          path: benchmark-model/*
          retention-days: 2

  benchmark:
    needs: prepare-model
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [4, 12, 13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt
      - name: Install analyzer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          python -m pip install --upgrade pip
          pip install -r services/analyzer/requirements.txt shapely
      - uses: actions/download-artifact@v4
        with:
          name: architect-model-${{ github.sha }}
          path: benchmark-model
      - name: Configure Architect detector
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          info=json.loads(Path("benchmark-model/model-info.json").read_text())
          with Path(os.environ["GITHUB_ENV"]).open("a") as env:
              env.write("SYMBOL_ONNX_MODEL="+str(Path("benchmark-model/architect.onnx").resolve())+"\n")
              env.write("SYMBOL_ONNX_CLASSES="+json.dumps(info["classes"],separators=(",",":"))+"\n")
              env.write("SYMBOL_MIN_CONFIDENCE=0.40\n")
              env.write("SYMBOL_ONNX_RAW_MIN_CONFIDENCE=0.25\n")
              env.write("PDF_NATIVE_TEXT_FASTPATH=1\n")
          PY
      - name: Run representative sheet
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: |
          mkdir -p "../../benchmark-output/architect-${{ matrix.shard }}"
          python -m app.aec_benchmark \
            --dataset ../../external/aec-geometric-bench/dataset \
            --output "../../benchmark-output/architect-${{ matrix.shard }}" \
            --offset "${{ matrix.shard }}" \
            --limit 1
      - uses: actions/upload-artifact@v4
        with:
          name: architect-sheet-${{ matrix.shard }}-${{ github.sha }}
          path: |
            benchmark-output/architect-${{ matrix.shard }}/*.json
            benchmark-output/architect-${{ matrix.shard }}/_canonical/*.json
            benchmark-output/architect-${{ matrix.shard }}/_timings/*.json
          if-no-files-found: error
          retention-days: 2

  score:
    if: always()
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/analyzer/requirements.txt shapely
      - uses: actions/download-artifact@v4
        with:
          pattern: architect-sheet-*-${{ github.sha }}
          path: benchmark-output/architect/predictions
          merge-multiple: true
      - name: Score Architect experiment
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from app.aec_benchmark import run_official_scorer

          root=Path("../..")
          pred=root/"benchmark-output/architect/predictions"
          dataset=root/"external/aec-geometric-bench/dataset"
          scorer=root/"external/aec-geometric-bench/scoring/score.py"
          sheets=sorted(p.stem for p in pred.glob("sheet_*.json"))
          if not sheets:
              raise SystemExit("No Architect predictions")
          code,output,report=run_official_scorer(
              scorer,pred,dataset,sheet_names=sheets,include_per_sheet=True,
          )
          target=root/"benchmark-output/architect"
          target.mkdir(exist_ok=True)
          (target/"score.txt").write_text(output,encoding="utf-8")
          if report is not None:
              (target/"report.json").write_text(
                  json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8"
              )
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
                  out.write("## Architect model experiment\n\n")
                  for name in ("Single Swing Door","Double Swing Door","Window","Sink","Toilet","Bathtub","Shower","Cooktops"):
                      item=report.get("classes",{}).get(name,{})
                      out.write(
                          f"- {name}: TP {item.get('tp',0)} FP {item.get('fp',0)} "
                          f"FN {item.get('fn',0)} F1 {item.get('f1',0):.3f}\n"
                      )
          print(output)
          raise SystemExit(code)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architect-score-${{ github.sha }}
          path: |
            benchmark-output/architect/score.txt
            benchmark-output/architect/report.json
          if-no-files-found: warn
          retention-days: 7
