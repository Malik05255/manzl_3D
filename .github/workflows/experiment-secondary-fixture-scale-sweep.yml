name: Secondary Fixture Scale Sweep

on:
  push:
    branches: [exp/secondary-fixture-scale-sweep]
    paths:
      - .github/workflows/experiment-secondary-fixture-scale-sweep.yml
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [9, 14]
        tile: [640, 960, 1600]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt
      - name: Install analyzer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          python -m pip install --upgrade pip
          pip install -r services/analyzer/requirements.txt pytest shapely
      - name: Download current primary FloorCAD model
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35762303613
          name: floorcad-onnx-64e7743e9794a9b74eb122f469bba3dd3d48d6a5
          path: primary-model
      - name: Download trained synthetic fixture model
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35771807959
          name: synthetic-object-model-ce173f1610d70efb74b1c49c1c72ed137d04e57a
          path: secondary-model-artifact
      - name: Configure detectors
        env:
          TILE_SIZE: ${{ matrix.tile }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          primary=json.loads(Path("primary-model/symbol-model-info.json").read_text())
          secondary=json.loads(Path("secondary-model-artifact/synthetic-model/classes.json").read_text())
          with Path(os.environ["GITHUB_ENV"]).open("a",encoding="utf-8") as env:
              env.write("SYMBOL_ONNX_MODEL="+str(Path("primary-model/floorcad-symbols.onnx").resolve())+"\n")
              env.write("SYMBOL_ONNX_CLASSES="+json.dumps(primary["classes"],separators=(",",":"))+"\n")
              env.write("SYMBOL_ONNX_RAW_MIN_CONFIDENCE=0.10\n")
              env.write("SYMBOL_MIN_CONFIDENCE=0.55\n")
              env.write("SYMBOL_SINK_MIN_CONFIDENCE=0.10\n")
              env.write("OPENING_ONNX_MIN_CONFIDENCE=0.35\n")
              env.write("SYMBOL_SECONDARY_ONNX_MODEL="+str(Path("secondary-model-artifact/synthetic-model/synthetic-objects.onnx").resolve())+"\n")
              env.write("SYMBOL_SECONDARY_ONNX_CLASSES="+json.dumps(secondary,separators=(",",":"))+"\n")
              env.write("SYMBOL_SECONDARY_ALLOWED_CLASSES=toilet,bathtub,shower,cooktop\n")
              env.write("SYMBOL_SECONDARY_ONNX_RAW_MIN_CONFIDENCE=0.15\n")
              env.write("SYMBOL_SECONDARY_ONNX_TILE_TRIGGER=640\n")
              env.write("SYMBOL_SECONDARY_ONNX_TILE_SIZE="+os.environ["TILE_SIZE"]+"\n")
              env.write("SYMBOL_SECONDARY_ONNX_TILE_OVERLAP=0.22\n")
              env.write("SYMBOL_TOILET_MIN_CONFIDENCE=0.50\n")
              env.write("SYMBOL_BATHTUB_MIN_CONFIDENCE=0.50\n")
              env.write("SYMBOL_SHOWER_MIN_CONFIDENCE=0.50\n")
              env.write("SYMBOL_COOKTOP_MIN_CONFIDENCE=0.50\n")
              env.write("PDF_NATIVE_TEXT_FASTPATH=1\n")
          PY
      - name: Run AEC sheet
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: |
          mkdir -p "../../benchmark-output/scale-${{ matrix.tile }}-${{ matrix.shard }}"
          python -m app.aec_benchmark             --dataset ../../external/aec-geometric-bench/dataset             --output "../../benchmark-output/scale-${{ matrix.tile }}-${{ matrix.shard }}"             --offset "${{ matrix.shard }}"             --limit 1
      - uses: actions/upload-artifact@v4
        with:
          name: secondary-scale-${{ matrix.tile }}-sheet-${{ matrix.shard }}-${{ github.sha }}
          path: |
            benchmark-output/scale-${{ matrix.tile }}-${{ matrix.shard }}/*.json
            benchmark-output/scale-${{ matrix.tile }}-${{ matrix.shard }}/_canonical/*.json
            benchmark-output/scale-${{ matrix.tile }}-${{ matrix.shard }}/_timings/*.json
          if-no-files-found: error
          retention-days: 4

  score:
    if: always()
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tile: [640, 960, 1600]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/analyzer/requirements.txt shapely
      - uses: actions/download-artifact@v4
        with:
          pattern: secondary-scale-${{ matrix.tile }}-sheet-*-${{ github.sha }}
          path: benchmark-output/scale-${{ matrix.tile }}/predictions
          merge-multiple: true
      - name: Score scale
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
          TILE_SIZE: ${{ matrix.tile }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from app.aec_benchmark import run_official_scorer
          root=Path("../..")
          tile=os.environ["TILE_SIZE"]
          pred=root/f"benchmark-output/scale-{tile}/predictions"
          dataset=root/"external/aec-geometric-bench/dataset"
          scorer=root/"external/aec-geometric-bench/scoring/score.py"
          sheets=sorted(p.stem for p in pred.glob("sheet_*.json"))
          code,output,report=run_official_scorer(
              scorer,pred,dataset,sheet_names=sheets,include_per_sheet=True,
          )
          target=root/f"benchmark-output/scale-{tile}"
          target.mkdir(exist_ok=True)
          (target/"score.txt").write_text(output,encoding="utf-8")
          (target/"report.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print("TILE",tile)
          print(output)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write(f"## Secondary fixture tile {tile}\n\n")
              for cls in ("Toilet","Bathtub","Shower","Cooktops"):
                  item=report.get("classes",{}).get(cls,{})
                  out.write(
                      f"- {cls}: TP {item.get('tp',0)} / FP {item.get('fp',0)} / "
                      f"F1 {float(item.get('f1',0)):.3f}\n"
                  )
              out.write(
                  f"- Object micro F1: {float(report.get('objectMicro',{}).get('f1',0)):.3f}\n"
              )
          raise SystemExit(code)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secondary-scale-score-${{ matrix.tile }}-${{ github.sha }}
          path: |
            benchmark-output/scale-${{ matrix.tile }}/score.txt
            benchmark-output/scale-${{ matrix.tile }}/report.json
          if-no-files-found: warn
          retention-days: 5
