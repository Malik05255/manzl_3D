name: Staging E2E

on:
  push:
    branches:
      - feat/cloud-floorplan-editor
  workflow_dispatch:

jobs:
  black-box:
    runs-on: ubuntu-latest
    env:
      MANZIL_API_URL: ${{ secrets.MANZIL_E2E_API_URL }}
    steps:
      - name: Check staging configuration
        id: staging
        shell: bash
        run: |
          if [ -n "$MANZIL_API_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "### Staging E2E skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Repository secret MANZIL_E2E_API_URL is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.staging.outputs.available == 'true'
      - uses: actions/setup-python@v5
        if: steps.staging.outputs.available == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.staging.outputs.available == 'true'
        with:
          node-version: 24
      - run: pip install PyMuPDF==1.26.4
        if: steps.staging.outputs.available == 'true'
      - run: python services/analyzer/tools/generate_e2e_fixture.py /tmp/manzil-e2e.pdf
        if: steps.staging.outputs.available == 'true'
      - name: Run staging journey
        if: steps.staging.outputs.available == 'true'
        env:
          MANZIL_E2E_SOURCE: /tmp/manzil-e2e.pdf
          MANZIL_E2E_TIMEOUT_MS: "240000"
        run: node scripts/e2e_remote.mjs
