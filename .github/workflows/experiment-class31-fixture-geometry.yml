name: Class31 Fixture Geometry

on:
  push:
    branches: [exp/class31-fixture-geometry]
    paths:
      - .github/workflows/experiment-class31-fixture-geometry.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          python -m pip install --upgrade pip
          pip install -r services/analyzer/requirements.txt
          pip install "ultralytics==8.3.249" "huggingface_hub>=0.34,<1" "onnx>=1.17,<2"
      - name: Export FloorCAD ONNX
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          from ultralytics import YOLO
          source=hf_hub_download(
              "mudasir13cs/floorcad-yolov8n-detect",
              "floorcad-yolov8n-detect.pt",
          )
          model=YOLO(source)
          exported=model.export(format="onnx",imgsz=640,opset=12,simplify=False,dynamic=False)
          target=Path("benchmark-model"); target.mkdir(exist_ok=True)
          shutil.copy2(exported,target/"floorcad.onnx")
          classes=[str(model.names[index]) for index in sorted(model.names)]
          (target/"classes.json").write_text(json.dumps(classes),encoding="utf-8")
          PY
      - name: Profile class31 fixture geometry
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
          SYMBOL_ONNX_MODEL: ../../benchmark-model/floorcad.onnx
          SYMBOL_ONNX_RAW_MIN_CONFIDENCE: "0.10"
        run: |
          python - <<'PY'
          import json, os, statistics, xml.etree.ElementTree as ET
          from collections import defaultdict
          from pathlib import Path
          from app.document import decode_document_with_page
          from app.symbols import extract_local_onnx_detections

          root=Path("../..")
          dataset=root/"external/aec-geometric-bench/dataset"
          classes=json.loads((root/"benchmark-model/classes.json").read_text())
          os.environ["SYMBOL_ONNX_CLASSES"]=json.dumps(classes,separators=(",",":"))
          manifest=json.loads((dataset/"manifest.json").read_text())
          xml=ET.parse(dataset/"annotations_15_scoring_ready.xml").getroot()
          images={Path(str(node.get("name"))).stem:node for node in xml.findall("image")}
          targets=["Sink","Toilet","Bathtub","Shower","Cooktops"]

          def iou(a,b):
              ax1,ay1,ax2,ay2=a; bx1,by1,bx2,by2=b
              iw=max(0.0,min(ax2,bx2)-max(ax1,bx1)); ih=max(0.0,min(ay2,by2)-max(ay1,by1))
              inter=iw*ih
              if inter<=0: return 0.0
              aa=max(0.0,ax2-ax1)*max(0.0,ay2-ay1); bb=max(0.0,bx2-bx1)*max(0.0,by2-by1)
              return inter/max(1e-9,aa+bb-inter)

          rows=[]
          for item in manifest["sheets"]:
              sheet=str(item["sheet"])
              data=(dataset/str(item["pdf"])).read_bytes()
              image,_=decode_document_with_page(data,"application/pdf")
              h,w=image.shape[:2]; base=float(min(h,w))
              sx=w/float(item["width"]); sy=h/float(item["height"])
              gt=defaultdict(list)
              for box in images[sheet].findall("box"):
                  label=str(box.get("label") or "")
                  if label not in targets: continue
                  gt[label].append([
                      float(box.get("xtl"))*sx,float(box.get("ytl"))*sy,
                      float(box.get("xbr"))*sx,float(box.get("ybr"))*sy,
                  ])
              for det in extract_local_onnx_detections(image):
                  name=str(det.get("class","")).strip().lower().replace("_"," ")
                  if name!="class 31": continue
                  x1,y1,x2,y2=map(float,det["bbox"])
                  bw=max(1.0,x2-x1); bh=max(1.0,y2-y1)
                  long=max(bw,bh); short=min(bw,bh)
                  best_cls=None; best_iou=0.0
                  for target in targets:
                      score=max((iou([x1,y1,x2,y2],truth) for truth in gt[target]),default=0.0)
                      if score>best_iou:
                          best_iou=score; best_cls=target
                  rows.append({
                      "sheet":sheet,
                      "split":"train" if int(sheet.split("_")[-1])%2 else "validation",
                      "confidence":round(float(det.get("confidence",0.0)),4),
                      "aspect":round(long/short,4),
                      "longRatio":round(long/base,5),
                      "shortRatio":round(short/base,5),
                      "bestClass":best_cls,
                      "bestIoU":round(best_iou,4),
                  })

          def quantiles(values):
              values=sorted(values)
              if not values: return {}
              def q(p):
                  idx=min(len(values)-1,max(0,round((len(values)-1)*p)))
                  return round(values[idx],5)
              return {"count":len(values),"min":round(values[0],5),"p10":q(.10),"p25":q(.25),"median":q(.50),"p75":q(.75),"p90":q(.90),"max":round(values[-1],5)}

          summary={}
          for target in targets:
              matched=[r for r in rows if r["bestClass"]==target and r["bestIoU"]>=.50]
              summary[target]={
                  "count":len(matched),
                  "confidence":quantiles([r["confidence"] for r in matched]),
                  "aspect":quantiles([r["aspect"] for r in matched]),
                  "longRatio":quantiles([r["longRatio"] for r in matched]),
                  "shortRatio":quantiles([r["shortRatio"] for r in matched]),
              }

          # Build simple rules from train true-positive quantiles, then evaluate
          # those rules on held-out even-numbered sheets.
          rules={}
          for target in targets:
              train_tp=[
                  r for r in rows if r["split"]=="train"
                  and r["bestClass"]==target and r["bestIoU"]>=.50
              ]
              if len(train_tp)<2:
                  continue
              aspect=[r["aspect"] for r in train_tp]; long=[r["longRatio"] for r in train_tp]; short=[r["shortRatio"] for r in train_tp]
              rule={
                  "confidenceMin":max(.10,min(r["confidence"] for r in train_tp)-.02),
                  "aspectMin":max(1.0,min(aspect)*.85),
                  "aspectMax":max(aspect)*1.15,
                  "longMin":max(.001,min(long)*.80),
                  "longMax":max(long)*1.20,
                  "shortMin":max(.001,min(short)*.80),
                  "shortMax":max(short)*1.20,
              }
              selected=[
                  r for r in rows if r["split"]=="validation"
                  and r["confidence"]>=rule["confidenceMin"]
                  and rule["aspectMin"]<=r["aspect"]<=rule["aspectMax"]
                  and rule["longMin"]<=r["longRatio"]<=rule["longMax"]
                  and rule["shortMin"]<=r["shortRatio"]<=rule["shortMax"]
              ]
              tp=sum(1 for r in selected if r["bestClass"]==target and r["bestIoU"]>=.50)
              fp=len(selected)-tp
              validation_gt=0
              for item in manifest["sheets"]:
                  sheet=str(item["sheet"])
                  if int(sheet.split("_")[-1])%2: continue
                  node=images[sheet]
                  validation_gt+=sum(1 for box in node.findall("box") if box.get("label")==target)
              fn=max(0,validation_gt-tp)
              precision=tp/(tp+fp) if tp+fp else 0.0
              recall=tp/(tp+fn) if tp+fn else 0.0
              f1=2*precision*recall/(precision+recall) if precision+recall else 0.0
              rules[target]={
                  "rule":{k:round(v,5) for k,v in rule.items()},
                  "validation":{"tp":tp,"fp":fp,"fn":fn,"precision":round(precision,4),"recall":round(recall,4),"f1":round(f1,4)},
              }

          result={"summary":summary,"rules":rules,"rows":rows}
          target=root/"benchmark-output/class31-fixture-geometry.json"
          target.parent.mkdir(exist_ok=True)
          target.write_text(json.dumps(result,indent=2),encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## class_31 fixture geometry\n\n")
              out.write("| Target | TP samples | Aspect median | Long ratio median | Short ratio median | Held-out F1 |\n")
              out.write("|---|---:|---:|---:|---:|---:|\n")
              for target in targets:
                  s=summary[target]
                  v=rules.get(target,{}).get("validation",{})
                  out.write(
                      f"| {target} | {s['count']} | {s.get('aspect',{}).get('median','-')} | "
                      f"{s.get('longRatio',{}).get('median','-')} | {s.get('shortRatio',{}).get('median','-')} | "
                      f"{v.get('f1','-')} |\n"
                  )
                  print(target,json.dumps({"summary":s,"rule":rules.get(target)},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: class31-fixture-geometry-${{ github.sha }}
          path: benchmark-output/class31-fixture-geometry.json
          retention-days: 5
