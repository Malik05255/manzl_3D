name: Fixture Raw Diagnostics

on:
  push:
    branches: [exp/fixture-raw-diagnostics]
    paths:
      - .github/workflows/experiment-fixture-raw-diagnostics.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          python -m pip install --upgrade pip
          pip install -r services/analyzer/requirements.txt
          pip install "ultralytics==8.3.249" "huggingface_hub>=0.34,<1" "onnx>=1.17,<2"
      - name: Export FloorCAD ONNX
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          from ultralytics import YOLO

          source=hf_hub_download(
              "mudasir13cs/floorcad-yolov8n-detect",
              "floorcad-yolov8n-detect.pt",
          )
          model=YOLO(source)
          exported=model.export(format="onnx",imgsz=640,opset=12,simplify=False,dynamic=False)
          target=Path("benchmark-model")
          target.mkdir(exist_ok=True)
          shutil.copy2(exported,target/"floorcad.onnx")
          classes=[str(model.names[index]) for index in sorted(model.names)]
          (target/"classes.json").write_text(json.dumps(classes),encoding="utf-8")
          print("CLASSES",classes)
          PY
      - name: Measure raw fixture IoU by threshold
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
          SYMBOL_ONNX_MODEL: ../../benchmark-model/floorcad.onnx
          SYMBOL_ONNX_RAW_MIN_CONFIDENCE: "0.10"
          PDF_NATIVE_TEXT_FASTPATH: "1"
        run: |
          python - <<'PY'
          import json, math, os, xml.etree.ElementTree as ET
          from collections import defaultdict, Counter
          from pathlib import Path

          from app.document import decode_document_with_page
          from app.symbols import extract_local_onnx_detections

          root=Path("../..")
          dataset=root/"external/aec-geometric-bench/dataset"
          classes=json.loads((root/"benchmark-model/classes.json").read_text())
          os.environ["SYMBOL_ONNX_CLASSES"]=json.dumps(classes,separators=(",",":"))

          manifest=json.loads((dataset/"manifest.json").read_text())
          xml=ET.parse(dataset/"annotations_15_scoring_ready.xml").getroot()
          images={Path(str(node.get("name"))).stem:node for node in xml.findall("image")}

          aliases={
              "sink":"Sink",
              "basin":"Sink",
              "lavatory":"Sink",
              "bath":"Bathtub",
              "bath tub":"Bathtub",
              "bath_tub":"Bathtub",
              "bathtub":"Bathtub",
              "toilet":"Toilet",
              "squat toilet":"Toilet",
              "squat_toilet":"Toilet",
              "wc":"Toilet",
              "gas stove":"Cooktops",
              "gas_stove":"Cooktops",
              "cooktop":"Cooktops",
              "stove":"Cooktops",
          }
          target_classes=["Sink","Toilet","Bathtub","Cooktops"]
          thresholds=[.10,.15,.20,.25,.30,.35,.40,.45,.50,.55]

          def normalize(value):
              return " ".join(str(value or "").strip().lower().replace("_"," ").replace("-"," ").split())

          def iou(a,b):
              ax1,ay1,ax2,ay2=a
              bx1,by1,bx2,by2=b
              iw=max(0.0,min(ax2,bx2)-max(ax1,bx1))
              ih=max(0.0,min(ay2,by2)-max(ay1,by1))
              inter=iw*ih
              if inter<=0:
                  return 0.0
              aa=max(0.0,ax2-ax1)*max(0.0,ay2-ay1)
              bb=max(0.0,bx2-bx1)*max(0.0,by2-by1)
              return inter/max(1e-9,aa+bb-inter)

          detections_by_sheet={}
          gt_by_sheet={}
          raw_counts=Counter()

          for item in manifest["sheets"]:
              sheet=str(item["sheet"])
              data=(dataset/str(item["pdf"])).read_bytes()
              image,_=decode_document_with_page(data,"application/pdf")
              h,w=image.shape[:2]
              sx=w/float(item["width"])
              sy=h/float(item["height"])

              gt=defaultdict(list)
              for box in images[sheet].findall("box"):
                  label=str(box.get("label") or "")
                  if label not in target_classes:
                      continue
                  gt[label].append([
                      float(box.get("xtl"))*sx,
                      float(box.get("ytl"))*sy,
                      float(box.get("xbr"))*sx,
                      float(box.get("ybr"))*sy,
                  ])
              gt_by_sheet[sheet]=gt

              raw=extract_local_onnx_detections(image)
              converted=[]
              for det in raw:
                  label=normalize(det.get("class"))
                  mapped=aliases.get(label)
                  raw_counts[label]+=1
                  if mapped not in target_classes:
                      continue
                  box=list(map(float,det["bbox"]))
                  converted.append({
                      "class":mapped,
                      "sourceClass":label,
                      "bbox":box,
                      "confidence":float(det.get("confidence",0.0)),
                  })
              detections_by_sheet[sheet]=converted
              print(sheet,"raw",len(raw),"mapped",len(converted),"gt",{
                  cls:len(gt[cls]) for cls in target_classes
              })

          result={
              "rawClassCounts":dict(raw_counts),
              "thresholds":{},
              "perSheet":{},
          }

          for threshold in thresholds:
              aggregate={}
              per_sheet={}
              for cls in target_classes:
                  tp=fp=fn=0
                  for item in manifest["sheets"]:
                      sheet=str(item["sheet"])
                      gt=list(gt_by_sheet[sheet][cls])
                      preds=[
                          det for det in detections_by_sheet[sheet]
                          if det["class"]==cls and det["confidence"]>=threshold
                      ]
                      pairs=[]
                      for pi,pred in enumerate(preds):
                          for gi,truth in enumerate(gt):
                              score=iou(pred["bbox"],truth)
                              if score>=.50:
                                  pairs.append((score,pi,gi))
                      pairs.sort(reverse=True)
                      used_p=set(); used_g=set(); matched=0
                      for score,pi,gi in pairs:
                          if pi in used_p or gi in used_g:
                              continue
                          used_p.add(pi); used_g.add(gi); matched+=1
                      tp+=matched
                      fp+=len(preds)-matched
                      fn+=len(gt)-matched
                  precision=tp/(tp+fp) if tp+fp else 0.0
                  recall=tp/(tp+fn) if tp+fn else 0.0
                  f1=2*precision*recall/(precision+recall) if precision+recall else 0.0
                  aggregate[cls]={
                      "tp":tp,"fp":fp,"fn":fn,
                      "precision":round(precision,4),
                      "recall":round(recall,4),
                      "f1":round(f1,4),
                  }
              result["thresholds"][f"{threshold:.2f}"]=aggregate

          # Best confidence and IoU distribution per mapped class, independent
          # of scorer threshold, to separate bad calibration from bad geometry.
          geometry={}
          for cls in target_classes:
              rows=[]
              for item in manifest["sheets"]:
                  sheet=str(item["sheet"])
                  truths=gt_by_sheet[sheet][cls]
                  for det in detections_by_sheet[sheet]:
                      if det["class"]!=cls:
                          continue
                      best=max((iou(det["bbox"],truth) for truth in truths),default=0.0)
                      rows.append({
                          "sheet":sheet,
                          "sourceClass":det["sourceClass"],
                          "confidence":round(det["confidence"],4),
                          "bestIoU":round(best,4),
                      })
              geometry[cls]=rows
          result["geometry"]=geometry

          target=root/"benchmark-output/fixture-raw-diagnostics.json"
          target.parent.mkdir(exist_ok=True)
          target.write_text(json.dumps(result,indent=2),encoding="utf-8")

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## Raw FloorCAD fixture diagnostics\n\n")
              out.write("| Threshold | Sink F1 | Toilet F1 | Bathtub F1 | Cooktops F1 |\n")
              out.write("|---:|---:|---:|---:|---:|\n")
              for threshold in thresholds:
                  row=result["thresholds"][f"{threshold:.2f}"]
                  out.write(
                      f"| {threshold:.2f} | {row['Sink']['f1']:.3f} | "
                      f"{row['Toilet']['f1']:.3f} | {row['Bathtub']['f1']:.3f} | "
                      f"{row['Cooktops']['f1']:.3f} |\n"
                  )

          for threshold in thresholds:
              row=result["thresholds"][f"{threshold:.2f}"]
              print("THRESHOLD",threshold,json.dumps(row,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-raw-diagnostics-${{ github.sha }}
          path: benchmark-output/fixture-raw-diagnostics.json
          retention-days: 5
