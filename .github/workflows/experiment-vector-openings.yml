name: Vector Opening Probe

on:
  push:
    branches: [exp/vector-openings]
    paths:
      - services/analyzer/tools/vector_opening_probe.py
      - services/analyzer/app/document.py
      - services/analyzer/app/openings.py
      - services/analyzer/app/local_analysis.py
      - services/analyzer/app/aec_benchmark.py
      - services/analyzer/tests/test_document.py
      - services/analyzer/tests/test_openings.py
      - .github/workflows/experiment-vector-openings.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt
      - name: Install analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/analyzer/requirements.txt pytest
      - name: Run PDF vector regression tests
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_document.py tests/test_openings.py
      - name: Probe vector opening geometry
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: |
          mkdir -p ../../benchmark-output/vector-probe
          python tools/vector_opening_probe.py \
            --dataset ../../external/aec-geometric-bench/dataset \
            --sheet sheet_05 \
            --output ../../benchmark-output/vector-probe/sheet_05.json
      - name: Score vector-window extraction on sheet 05
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
          PDF_NATIVE_TEXT_FASTPATH: "1"
        run: |
          mkdir -p ../../benchmark-output/vector-window-score
          python -m app.aec_benchmark \
            --dataset ../../external/aec-geometric-bench/dataset \
            --output ../../benchmark-output/vector-window-score \
            --offset 4 \
            --limit 1 \
            --scorer ../../external/aec-geometric-bench/scoring/score.py \
            --report-json ../../benchmark-output/vector-window-score/report.json \
            | tee ../../benchmark-output/vector-window-score/score.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vector-opening-probe-${{ github.sha }}
          path: |
            benchmark-output/vector-probe/sheet_05.json
            benchmark-output/vector-window-score/sheet_05.json
            benchmark-output/vector-window-score/_canonical/sheet_05.json
            benchmark-output/vector-window-score/_timings/sheet_05.json
            benchmark-output/vector-window-score/report.json
            benchmark-output/vector-window-score/score.txt
          if-no-files-found: warn
          retention-days: 3
