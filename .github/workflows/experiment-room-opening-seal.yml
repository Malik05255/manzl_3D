name: Room Opening Seal Experiment

on:
  push:
    branches: [exp/room-opening-seal]
    paths:
      - services/analyzer/app/rooms.py
      - services/analyzer/app/local_analysis.py
      - services/analyzer/tests/test_rooms.py
      - .github/workflows/experiment-room-opening-seal.yml
  workflow_dispatch:

jobs:
  sheet-07:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          python -m pip install --upgrade pip
          pip install -r services/analyzer/requirements.txt pytest shapely
          pip install "ultralytics==8.3.249" "huggingface_hub>=0.34,<1" "onnx>=1.17,<2"
      - name: Run room regression tests
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_rooms.py
      - name: Export FloorCAD ONNX
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          from ultralytics import YOLO

          source=hf_hub_download(
              "mudasir13cs/floorcad-yolov8n-detect",
              "floorcad-yolov8n-detect.pt",
          )
          model=YOLO(source)
          exported=model.export(format="onnx",imgsz=640,opset=12,simplify=False,dynamic=False)
          target=Path("benchmark-model")
          target.mkdir(exist_ok=True)
          shutil.copy2(exported,target/"floorcad.onnx")
          classes=[str(model.names[index]) for index in sorted(model.names)]
          (target/"classes.json").write_text(json.dumps(classes),encoding="utf-8")
          PY
      - name: Configure detector
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          classes=json.loads(Path("benchmark-model/classes.json").read_text())
          with Path(os.environ["GITHUB_ENV"]).open("a") as env:
              env.write("SYMBOL_ONNX_MODEL="+str(Path("benchmark-model/floorcad.onnx").resolve())+"\n")
              env.write("SYMBOL_ONNX_CLASSES="+json.dumps(classes,separators=(",",":"))+"\n")
              env.write("SYMBOL_ONNX_RAW_MIN_CONFIDENCE=0.30\n")
              env.write("SYMBOL_MIN_CONFIDENCE=0.55\n")
              env.write("PDF_NATIVE_TEXT_FASTPATH=1\n")
          PY
      - name: Analyze and score sheet 07
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: |
          mkdir -p ../../benchmark-output/room-seal
          python -m app.aec_benchmark \
            --dataset ../../external/aec-geometric-bench/dataset \
            --output ../../benchmark-output/room-seal \
            --offset 6 --limit 1
          python - <<'PY'
          import json, os
          from pathlib import Path
          from app.aec_benchmark import run_official_scorer

          root=Path("../..")
          pred=root/"benchmark-output/room-seal"
          dataset=root/"external/aec-geometric-bench/dataset"
          scorer=root/"external/aec-geometric-bench/scoring/score.py"
          code,output,report=run_official_scorer(
              scorer,pred,dataset,sheet_names=["sheet_07"],include_per_sheet=True,
          )
          (pred/"report.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8"
          )
          canonical=json.loads((pred/"_canonical/sheet_07.json").read_text())
          timing=json.loads((pred/"_timings/sheet_07.json").read_text())
          sheet=report.get("sheets",{}).get("sheet_07",{})
          print("ROOM_SEAL_ROOMS",len(canonical.get("rooms",[])))
          print("ROOM_SEAL_ANALYSIS_SECONDS",timing.get("analysisSeconds"))
          print("ROOM_SEAL_MACRO_F1",sheet.get("macroF1",0))
          print("ROOM_SEAL_WALL_F1",sheet.get("wallPixel",{}).get("f1",0))
          print("ROOM_SEAL_AREA_PIXEL_F1",sheet.get("areaPixel",{}).get("f1",0))
          print("ROOM_SEAL_AREA_INSTANCE_F1",sheet.get("areaInstance",{}).get("f1",0))
          print(output)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## Room opening seal — sheet_07\n\n")
              out.write(f"- rooms: {len(canonical.get('rooms',[]))}\n")
              out.write(f"- analysis: {float(timing.get('analysisSeconds',0)):.2f}s\n")
              out.write(f"- macroF1: {float(sheet.get('macroF1',0)):.4f}\n")
              out.write(f"- wall F1: {float(sheet.get('wallPixel',{}).get('f1',0)):.3f}\n")
              out.write(f"- area pixel F1: {float(sheet.get('areaPixel',{}).get('f1',0)):.3f}\n")
              out.write(f"- area instance F1: {float(sheet.get('areaInstance',{}).get('f1',0)):.3f}\n")
          raise SystemExit(code)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-opening-seal-sheet07-${{ github.sha }}
          path: |
            benchmark-output/room-seal/sheet_07.json
            benchmark-output/room-seal/_canonical/sheet_07.json
            benchmark-output/room-seal/_timings/sheet_07.json
            benchmark-output/room-seal/report.json
          if-no-files-found: warn
          retention-days: 5
