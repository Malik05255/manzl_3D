name: Shared Opening Pass Experiment

on:
  push:
    branches: [exp/shared-opening-pass]
    paths:
      - services/analyzer/app/openings.py
      - services/analyzer/app/local_analysis.py
      - services/analyzer/tests/test_openings.py
      - .github/workflows/experiment-shared-opening.yml
  workflow_dispatch:

jobs:
  benchmark-sheet-05:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          python -m pip install --upgrade pip
          pip install -r services/analyzer/requirements.txt pytest shapely
          pip install "ultralytics==8.3.249" "huggingface_hub>=0.34,<1" "onnx>=1.17,<2"
      - name: Verify opening regressions
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_openings.py
      - name: Export FloorCAD ONNX
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          from ultralytics import YOLO
          source=hf_hub_download("mudasir13cs/floorcad-yolov8n-detect","floorcad-yolov8n-detect.pt")
          model=YOLO(source)
          exported=model.export(format="onnx",imgsz=640,opset=12,simplify=False,dynamic=False)
          target=Path("benchmark-model"); target.mkdir(exist_ok=True)
          shutil.copy2(exported,target/"floorcad.onnx")
          classes=[str(model.names[index]) for index in sorted(model.names)]
          (target/"classes.json").write_text(json.dumps(classes),encoding="utf-8")
          PY
      - name: Configure detector
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          classes=json.loads(Path("benchmark-model/classes.json").read_text())
          with Path(os.environ["GITHUB_ENV"]).open("a") as env:
              env.write("SYMBOL_ONNX_MODEL="+str(Path("benchmark-model/floorcad.onnx").resolve())+"\n")
              env.write("SYMBOL_ONNX_CLASSES="+json.dumps(classes,separators=(",",":"))+"\n")
              env.write("SYMBOL_MIN_CONFIDENCE=0.55\n")
              env.write("PDF_NATIVE_TEXT_FASTPATH=1\n")
          PY
      - name: Analyze and score sheet 05
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: |
          mkdir -p ../../benchmark-output/shared-opening
          python -m app.aec_benchmark \
            --dataset ../../external/aec-geometric-bench/dataset \
            --output ../../benchmark-output/shared-opening \
            --offset 4 --limit 1
          python - <<'PY'
          import json, os
          from pathlib import Path
          from app.aec_benchmark import run_official_scorer
          root=Path("../..")
          pred=root/"benchmark-output/shared-opening"
          dataset=root/"external/aec-geometric-bench/dataset"
          scorer=root/"external/aec-geometric-bench/scoring/score.py"
          code,output,report=run_official_scorer(
              scorer,pred,dataset,sheet_names=["sheet_05"],include_per_sheet=True,
          )
          timing=json.loads((pred/"_timings/sheet_05.json").read_text())
          print("SHARED_OPENING_SECONDS",timing["analysisSeconds"])
          print(output)
          if report is not None:
              (pred/"report.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write(f"## Shared opening pass — sheet_05\n\nAnalysis: {timing['analysisSeconds']:.2f}s\n\n")
              if report:
                  for cls in ("Single Swing Door","Double Swing Door","Window"):
                      x=report.get("classes",{}).get(cls,{})
                      out.write(f"- {cls}: TP {x.get('tp',0)} FP {x.get('fp',0)} FN {x.get('fn',0)} F1 {x.get('f1',0):.3f}\n")
          raise SystemExit(code)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-opening-sheet05-${{ github.sha }}
          path: |
            benchmark-output/shared-opening/_timings/sheet_05.json
            benchmark-output/shared-opening/_canonical/sheet_05.json
            benchmark-output/shared-opening/report.json
          if-no-files-found: warn
          retention-days: 5
