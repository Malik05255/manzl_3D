name: Full Synthetic Raw Probe

on:
  push:
    branches: [exp/synthetic-object-detector-full-v2]
    paths:
      - .github/workflows/experiment-synthetic-raw-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [4, 13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r services/analyzer/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35771807959
          name: synthetic-object-model-ce173f1610d70efb74b1c49c1c72ed137d04e57a
          path: synthetic-model-artifact
      - name: Probe raw detector output
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
          SHARD: ${{ matrix.shard }}
          SYMBOL_ONNX_RAW_MIN_CONFIDENCE: "0.01"
        run: |
          python - <<'PY'
          import json, os, statistics
          from collections import Counter,defaultdict
          from pathlib import Path
          from app.document import decode_document_with_page
          from app.symbols import extract_local_onnx_detections

          root=Path("../..")
          dataset=root/"external/aec-geometric-bench/dataset"
          classes=json.loads(
              (root/"synthetic-model-artifact/synthetic-model/classes.json").read_text()
          )
          os.environ["SYMBOL_ONNX_MODEL"]=str(
              (root/"synthetic-model-artifact/synthetic-model/synthetic-objects.onnx").resolve()
          )
          os.environ["SYMBOL_ONNX_CLASSES"]=json.dumps(classes,separators=(",",":"))
          manifest=json.loads((dataset/"manifest.json").read_text())
          item=manifest["sheets"][int(os.environ["SHARD"])]
          sheet=str(item["sheet"])
          image,_=decode_document_with_page(
              (dataset/str(item["pdf"])).read_bytes(),
              "application/pdf",
          )
          raw=extract_local_onnx_detections(image)
          by_class=defaultdict(list)
          for det in raw:
              by_class[str(det.get("class"))].append(float(det.get("confidence",0)))
          result={
              "sheet":sheet,
              "imageSize":[image.shape[1],image.shape[0]],
              "count":len(raw),
              "classes":{
                  cls:{
                      "count":len(scores),
                      "max":max(scores) if scores else 0,
                      "median":statistics.median(scores) if scores else 0,
                      "at005":sum(1 for s in scores if s>=.05),
                      "at010":sum(1 for s in scores if s>=.10),
                      "at020":sum(1 for s in scores if s>=.20),
                  }
                  for cls,scores in sorted(by_class.items())
              },
          }
          print("RAW_PROBE",json.dumps(result,sort_keys=True))
          target=root/f"benchmark-output/raw-probe/{sheet}.json"
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(result,indent=2),encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-raw-probe-${{ matrix.shard }}-${{ github.sha }}
          path: benchmark-output/raw-probe/*.json
          retention-days: 3
