name: Synthetic Tile Scale Probe

on:
  push:
    branches: [exp/synthetic-object-detector-fast-v2]
    paths:
      - .github/workflows/experiment-synthetic-tile-scale.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tile: [960, 640, 480]
        shard: [4, 13, 14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r services/analyzer/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35772651346
          name: synthetic-object-model-3110e7f36bdee04e45278c7d2da5046fc8e83058
          path: synthetic-model-artifact

      - name: Probe raw custom detections
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
          TILE: ${{ matrix.tile }}
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from collections import defaultdict, Counter
          from pathlib import Path
          from app.document import decode_document_with_page
          from app.symbols import extract_local_onnx_detections

          root=Path("../..")
          dataset=root/"external/aec-geometric-bench/dataset"
          model=root/"synthetic-model-artifact/synthetic-model/synthetic-objects.onnx"
          classes=json.loads((root/"synthetic-model-artifact/synthetic-model/classes.json").read_text())
          manifest=json.loads((dataset/"manifest.json").read_text())
          item=manifest["sheets"][int(os.environ["SHARD"])]
          sheet=str(item["sheet"])
          tile=int(os.environ["TILE"])
          annotations=ET.parse(dataset/"annotations_15_scoring_ready.xml").getroot()
          image_node=next(
              node for node in annotations.findall("image")
              if Path(str(node.get("name"))).stem==sheet
          )
          image,_=decode_document_with_page((dataset/str(item["pdf"])).read_bytes(),"application/pdf")
          h,w=image.shape[:2]
          sx=w/float(item["width"]); sy=h/float(item["height"])

          target_map={
              "toilet":"Toilet",
              "bathtub":"Bathtub",
              "shower":"Shower",
              "cooktop":"Cooktops",
              "sink":"Sink",
              "single_swing_door":"Single Swing Door",
              "double_swing_door":"Double Swing Door",
          }
          gt=defaultdict(list)
          for box in image_node.findall("box"):
              label=str(box.get("label") or "")
              if label not in set(target_map.values()): continue
              gt[label].append([
                  float(box.get("xtl"))*sx,float(box.get("ytl"))*sy,
                  float(box.get("xbr"))*sx,float(box.get("ybr"))*sy,
              ])

          def iou(a,b):
              ax1,ay1,ax2,ay2=map(float,a); bx1,by1,bx2,by2=map(float,b)
              iw=max(0.0,min(ax2,bx2)-max(ax1,bx1)); ih=max(0.0,min(ay2,by2)-max(ay1,by1))
              inter=iw*ih
              if inter<=0:return 0.0
              aa=max(0.0,ax2-ax1)*max(0.0,ay2-ay1); bb=max(0.0,bx2-bx1)*max(0.0,by2-by1)
              return inter/max(1e-9,aa+bb-inter)

          os.environ["SYMBOL_ONNX_MODEL"]=str(model)
          os.environ["SYMBOL_ONNX_CLASSES"]=json.dumps(classes,separators=(",",":"))
          os.environ["SYMBOL_ONNX_INPUT_SIZE"]="640"
          os.environ["SYMBOL_ONNX_RAW_MIN_CONFIDENCE"]="0.01"
          os.environ["SYMBOL_ONNX_TILE_TRIGGER"]="640"
          os.environ["SYMBOL_ONNX_TILE_SIZE"]=str(tile)
          os.environ["SYMBOL_ONNX_TILE_OVERLAP"]="0.25"
          os.environ["SYMBOL_ONNX_NMS_IOU"]="0.45"
          detections=extract_local_onnx_detections(image)
          counts=Counter(str(d.get("class")) for d in detections)
          rows={}
          for source,target in target_map.items():
              preds=[d for d in detections if str(d.get("class"))==source]
              truths=gt[target]
              best=[max((iou(d["bbox"],truth) for truth in truths),default=0.0) for d in preds]
              rows[source]={
                  "count":len(preds),
                  "gt":len(truths),
                  "bestIoU":max(best,default=0.0),
                  "iou25":sum(1 for x in best if x>=.25),
                  "iou50":sum(1 for x in best if x>=.50),
                  "topConf":max((float(d.get("confidence",0)) for d in preds),default=0.0),
              }

          result={"sheet":sheet,"tile":tile,"counts":dict(counts),"rows":rows}
          target=root/f"benchmark-output/tile-probe/{sheet}-{tile}.json"
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(result,indent=2),encoding="utf-8")
          print("RESULT",json.dumps(result,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-tile-probe-${{ matrix.shard }}-${{ matrix.tile }}-${{ github.sha }}
          path: benchmark-output/tile-probe/*.json
          retention-days: 4

  aggregate:
    if: always()
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: synthetic-tile-probe-*-${{ github.sha }}
          path: reports
          merge-multiple: true
      - name: Aggregate scale probe
        run: |
          python - <<'PY'
          import json, os
          from collections import defaultdict
          from pathlib import Path
          files=sorted(Path("reports").glob("*.json"))
          if not files: raise SystemExit("No reports")
          reports=[json.loads(p.read_text()) for p in files]
          classes=["toilet","bathtub","shower","cooktop","sink","single_swing_door","double_swing_door"]
          summary=defaultdict(dict)
          for tile in sorted({r["tile"] for r in reports}):
              subset=[r for r in reports if r["tile"]==tile]
              for cls in classes:
                  rows=[r["rows"][cls] for r in subset]
                  summary[str(tile)][cls]={
                      "count":sum(x["count"] for x in rows),
                      "iou25":sum(x["iou25"] for x in rows),
                      "iou50":sum(x["iou50"] for x in rows),
                      "maxBestIoU":max((x["bestIoU"] for x in rows),default=0.0),
                      "maxConf":max((x["topConf"] for x in rows),default=0.0),
                  }
          Path("synthetic-tile-scale-report.json").write_text(json.dumps(summary,indent=2),encoding="utf-8")
          for tile,data in summary.items():
              print("TILE",tile,json.dumps(data,sort_keys=True))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## Synthetic detector tile-scale probe\n\n")
              out.write("| Tile | Class | Raw | IoU>=.25 | IoU>=.50 | Best IoU | Max conf |\n")
              out.write("|---:|---|---:|---:|---:|---:|---:|\n")
              for tile in sorted(summary,key=int):
                  for cls in classes:
                      row=summary[tile][cls]
                      out.write(
                          f"| {tile} | {cls} | {row['count']} | {row['iou25']} | "
                          f"{row['iou50']} | {row['maxBestIoU']:.3f} | {row['maxConf']:.3f} |\n"
                      )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-tile-scale-report-${{ github.sha }}
          path: synthetic-tile-scale-report.json
          retention-days: 5
