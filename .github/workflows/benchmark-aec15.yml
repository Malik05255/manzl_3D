name: AEC-15 Benchmark

on:
  workflow_dispatch:
    inputs:
      dataset_repository:
        description: "Repository containing the licensed AEC-Geometric-Bench dataset"
        required: true
        default: "KamaiEnterprises/aec-geometric-bench"
        type: string
      dataset_ref:
        description: "Dataset git ref"
        required: true
        default: "main"
        type: string
      license_confirmed:
        description: "I confirm this benchmark run is permitted by the dataset licence"
        required: true
        default: false
        type: boolean

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check dataset licence confirmation
        run: |
          if [ "${{ inputs.license_confirmed }}" != "true" ]; then
            echo "Dataset licence confirmation is required."
            exit 1
          fi

      - name: Checkout Manzil H
        uses: actions/checkout@v4
        with:
          path: manzil

      - name: Checkout benchmark dataset
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.dataset_repository }}
          ref: ${{ inputs.dataset_ref }}
          path: aec-bench

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: manzil/services/analyzer/requirements.txt

      - name: Install analyzer and scorer dependencies
        run: |
          pip install -r manzil/services/analyzer/requirements.txt
          pip install shapely Pillow

      - name: Record benchmark source revision
        run: |
          mkdir -p benchmark-output
          git -C aec-bench rev-parse HEAD > benchmark-output/dataset-commit.txt
          git -C manzil rev-parse HEAD > benchmark-output/manzil-commit.txt

      - name: Run AEC-Geometric-Bench-15
        working-directory: manzil/services/analyzer
        env:
          PYTHONPATH: .
        run: |
          python -m app.aec_benchmark             --dataset ../../../aec-bench/dataset             --output ../../../benchmark-output/predictions             --scorer ../../../aec-bench/scoring/score.py             | tee ../../../benchmark-output/score.txt

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: manzil-aec15-${{ github.sha }}
          path: |
            benchmark-output/score.txt
            benchmark-output/manzil-commit.txt
            benchmark-output/dataset-commit.txt
            benchmark-output/predictions/*.json
          if-no-files-found: error
          retention-days: 30
