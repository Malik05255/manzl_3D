name: MIT Fixture Detector Benchmark

on:
  push:
    branches: [exp/mit-fixture-detector]
    paths:
      - .github/workflows/experiment-mit-fixture-detector.yml
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench

      - uses: actions/checkout@v4
        with:
          repository: sanatladkat/floor-plan-object-detection
          ref: main
          path: external/mit-floorplan-detector

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          python -m pip install --upgrade pip
          pip install -r services/analyzer/requirements.txt
          pip install "ultralytics==8.3.249" "onnx>=1.17,<2"

      - name: Export MIT detector to ONNX
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from ultralytics import YOLO

          model=YOLO("external/mit-floorplan-detector/best.pt")
          print("MODEL_NAMES",json.dumps(model.names,sort_keys=True))
          exported=model.export(
              format="onnx",
              imgsz=640,
              opset=12,
              simplify=False,
              dynamic=False,
          )
          target=Path("benchmark-model")
          target.mkdir(exist_ok=True)
          shutil.copy2(exported,target/"mit-floorplan.onnx")
          classes=[str(model.names[index]) for index in sorted(model.names)]
          (target/"classes.json").write_text(json.dumps(classes),encoding="utf-8")
          PY

      - name: Benchmark fixture classes on AEC-15
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
          SYMBOL_ONNX_MODEL: ../../benchmark-model/mit-floorplan.onnx
          SYMBOL_ONNX_RAW_MIN_CONFIDENCE: "0.10"
        run: |
          python - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from collections import Counter, defaultdict
          from pathlib import Path

          from app.document import decode_document_with_page
          from app.symbols import extract_local_onnx_detections

          root=Path("../..")
          dataset=root/"external/aec-geometric-bench/dataset"
          classes=json.loads((root/"benchmark-model/classes.json").read_text())
          os.environ["SYMBOL_ONNX_CLASSES"]=json.dumps(classes,separators=(",",":"))
          print("CLASSES",classes)

          manifest=json.loads((dataset/"manifest.json").read_text())
          annotations=ET.parse(dataset/"annotations_15_scoring_ready.xml").getroot()
          images={Path(str(node.get("name"))).stem:node for node in annotations.findall("image")}

          targets=["Sink","Toilet","Bathtub","Shower","Cooktops"]
          aliases={
              "sink":"Sink",
              "kitchen sink":"Sink",
              "wash basin":"Sink",
              "washbasin":"Sink",
              "basin":"Sink",
              "toilet":"Toilet",
              "wc":"Toilet",
              "water closet":"Toilet",
              "squat toilet":"Toilet",
              "bathtub":"Bathtub",
              "bath tub":"Bathtub",
              "bath":"Bathtub",
              "shower":"Shower",
              "shower room":"Shower",
              "cooktop":"Cooktops",
              "cook top":"Cooktops",
              "stove":"Cooktops",
              "gas stove":"Cooktops",
              "range":"Cooktops",
          }
          thresholds=[.10,.15,.20,.25,.30,.35,.40,.50,.60]

          def norm(value):
              return " ".join(str(value or "").strip().lower().replace("_"," ").replace("-"," ").split())

          def iou(a,b):
              ax1,ay1,ax2,ay2=a; bx1,by1,bx2,by2=b
              iw=max(0.0,min(ax2,bx2)-max(ax1,bx1))
              ih=max(0.0,min(ay2,by2)-max(ay1,by1))
              inter=iw*ih
              if inter<=0: return 0.0
              aa=max(0.0,ax2-ax1)*max(0.0,ay2-ay1)
              bb=max(0.0,bx2-bx1)*max(0.0,by2-by1)
              return inter/max(1e-9,aa+bb-inter)

          gt_by_sheet={}
          pred_by_sheet={}
          raw_counts=Counter()

          for item in manifest["sheets"]:
              sheet=str(item["sheet"])
              image,_=decode_document_with_page(
                  (dataset/str(item["pdf"])).read_bytes(),
                  "application/pdf",
              )
              h,w=image.shape[:2]
              sx=w/float(item["width"])
              sy=h/float(item["height"])

              gt=defaultdict(list)
              for box in images[sheet].findall("box"):
                  label=str(box.get("label") or "")
                  if label not in targets: continue
                  gt[label].append([
                      float(box.get("xtl"))*sx,
                      float(box.get("ytl"))*sy,
                      float(box.get("xbr"))*sx,
                      float(box.get("ybr"))*sy,
                  ])
              gt_by_sheet[sheet]=gt

              raw=extract_local_onnx_detections(image)
              mapped=[]
              for det in raw:
                  name=norm(det.get("class"))
                  raw_counts[name]+=1
                  cls=aliases.get(name)
                  if cls not in targets:
                      continue
                  mapped.append({
                      "class":cls,
                      "sourceClass":name,
                      "confidence":float(det.get("confidence",0.0)),
                      "bbox":list(map(float,det["bbox"])),
                  })
              pred_by_sheet[sheet]=mapped
              print(
                  sheet,
                  "raw",len(raw),
                  "mapped",len(mapped),
                  "gt",{cls:len(gt[cls]) for cls in targets},
              )

          rows={}
          for threshold in thresholds:
              metrics={}
              for cls in targets:
                  tp=fp=fn=0
                  for item in manifest["sheets"]:
                      sheet=str(item["sheet"])
                      truth=list(gt_by_sheet[sheet][cls])
                      preds=[
                          det for det in pred_by_sheet[sheet]
                          if det["class"]==cls and det["confidence"]>=threshold
                      ]
                      pairs=[]
                      for pi,pred in enumerate(preds):
                          for gi,gt in enumerate(truth):
                              score=iou(pred["bbox"],gt)
                              if score>=.50:
                                  pairs.append((score,pi,gi))
                      pairs.sort(reverse=True)
                      used_p=set(); used_g=set(); matched=0
                      for score,pi,gi in pairs:
                          if pi in used_p or gi in used_g:
                              continue
                          used_p.add(pi); used_g.add(gi); matched+=1
                      tp+=matched
                      fp+=len(preds)-matched
                      fn+=len(truth)-matched
                  p=tp/(tp+fp) if tp+fp else 0.0
                  r=tp/(tp+fn) if tp+fn else 0.0
                  f1=2*p*r/(p+r) if p+r else 0.0
                  metrics[cls]={
                      "tp":tp,"fp":fp,"fn":fn,
                      "precision":round(p,4),
                      "recall":round(r,4),
                      "f1":round(f1,4),
                  }
              rows[f"{threshold:.2f}"]=metrics
              print("THRESHOLD",threshold,json.dumps(metrics,sort_keys=True))

          result={
              "classes":classes,
              "rawClassCounts":dict(raw_counts),
              "thresholds":rows,
          }
          target=root/"benchmark-output/mit-fixture-detector.json"
          target.parent.mkdir(exist_ok=True)
          target.write_text(json.dumps(result,indent=2),encoding="utf-8")

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## MIT fixture detector — AEC-15\n\n")
              out.write(f"Classes: {', '.join(classes)}\n\n")
              out.write("| Threshold | Sink F1 | Toilet F1 | Bathtub F1 | Shower F1 | Cooktops F1 |\n")
              out.write("|---:|---:|---:|---:|---:|---:|\n")
              for threshold in thresholds:
                  m=rows[f"{threshold:.2f}"]
                  out.write(
                      f"| {threshold:.2f} | {m['Sink']['f1']:.3f} | "
                      f"{m['Toilet']['f1']:.3f} | {m['Bathtub']['f1']:.3f} | "
                      f"{m['Shower']['f1']:.3f} | {m['Cooktops']['f1']:.3f} |\n"
                  )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mit-fixture-detector-${{ github.sha }}
          path: benchmark-output/mit-fixture-detector.json
          retention-days: 5
