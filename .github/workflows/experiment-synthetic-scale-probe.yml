name: Synthetic Scale Probe

on:
  push:
    branches: [exp/synthetic-scale-probe]
    paths:
      - .github/workflows/experiment-synthetic-scale-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [4, 13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r services/analyzer/requirements.txt
      - name: Reuse trained synthetic model
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35772651346
          name: synthetic-object-model-3110e7f36bdee04e45278c7d2da5046fc8e83058
          path: synthetic-model-artifact
      - name: Probe raw detections across tile scales
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter, defaultdict
          from pathlib import Path

          from app.document import decode_document_with_page
          from app.symbols import extract_local_onnx_detections

          root=Path("../..")
          dataset=root/"external/aec-geometric-bench/dataset"
          manifest=json.loads((dataset/"manifest.json").read_text())
          item=manifest["sheets"][int(os.environ["SHARD"])]
          sheet=str(item["sheet"])
          image,_=decode_document_with_page(
              (dataset/str(item["pdf"])).read_bytes(),
              "application/pdf",
          )

          model=Path(
              "../../synthetic-model-artifact/synthetic-model/synthetic-objects.onnx"
          ).resolve()
          classes=json.loads(
              Path(
                  "../../synthetic-model-artifact/synthetic-model/classes.json"
              ).read_text()
          )
          os.environ["SYMBOL_ONNX_MODEL"]=str(model)
          os.environ["SYMBOL_ONNX_CLASSES"]=json.dumps(classes,separators=(",",":"))
          os.environ["SYMBOL_ONNX_INPUT_SIZE"]="640"
          os.environ["SYMBOL_ONNX_RAW_MIN_CONFIDENCE"]="0.05"
          os.environ["SYMBOL_ONNX_TILE_TRIGGER"]="640"
          os.environ["SYMBOL_ONNX_TILE_OVERLAP"]="0.25"

          result={"sheet":sheet,"imageSize":[image.shape[1],image.shape[0]],"configs":{}}
          for tile_size in [640,800,960,1200,1600]:
              os.environ["SYMBOL_ONNX_TILE_SIZE"]=str(tile_size)
              detections=extract_local_onnx_detections(image)
              counts=Counter(str(d.get("class")) for d in detections)
              by_class=defaultdict(list)
              for det in detections:
                  by_class[str(det.get("class"))].append(float(det.get("confidence",0)))
              summary={
                  "count":len(detections),
                  "classes":dict(counts),
                  "maxConfidence":{
                      cls:round(max(values),4)
                      for cls,values in by_class.items()
                  },
                  "p90Confidence":{
                      cls:round(sorted(values)[max(0,int(len(values)*.9)-1)],4)
                      for cls,values in by_class.items()
                  },
              }
              result["configs"][str(tile_size)]=summary
              print("TILE",tile_size,json.dumps(summary,sort_keys=True))

          target=root/f"benchmark-output/scale-probe/{sheet}.json"
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(result,indent=2),encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-scale-probe-${{ matrix.shard }}-${{ github.sha }}
          path: benchmark-output/scale-probe/*.json
          retention-days: 5

  aggregate:
    if: always()
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: synthetic-scale-probe-*-${{ github.sha }}
          path: reports
          merge-multiple: true
      - name: Summarize
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          reports=[json.loads(p.read_text()) for p in sorted(Path("reports").glob("*.json"))]
          Path("synthetic-scale-probe-report.json").write_text(
              json.dumps(reports,indent=2),
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## Synthetic detector raw scale probe\n\n")
              for report in reports:
                  out.write(f"### {report['sheet']}\n\n")
                  out.write("| Tile | Raw detections | Classes |\n|---:|---:|---|\n")
                  for tile,summary in report["configs"].items():
                      out.write(
                          f"| {tile} | {summary['count']} | "
                          f"`{json.dumps(summary['classes'],sort_keys=True)}` |\n"
                      )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-scale-probe-report-${{ github.sha }}
          path: synthetic-scale-probe-report.json
          retention-days: 5
