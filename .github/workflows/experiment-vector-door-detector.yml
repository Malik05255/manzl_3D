name: Vector Door Detector Experiment

on:
  push:
    branches: [exp/vector-door-detector]
    paths:
      - services/analyzer/app/openings.py
      - services/analyzer/app/local_analysis.py
      - services/analyzer/tests/test_openings.py
      - .github/workflows/experiment-vector-door-detector.yml
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [4, 9, 13, 14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          python -m pip install --upgrade pip
          pip install -r services/analyzer/requirements.txt pytest shapely
          pip install "ultralytics==8.3.249" "huggingface_hub>=0.34,<1" "onnx>=1.17,<2"
      - name: Run opening regression tests
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_openings.py
      - name: Export FloorCAD ONNX
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          from ultralytics import YOLO
          source=hf_hub_download(
              "mudasir13cs/floorcad-yolov8n-detect",
              "floorcad-yolov8n-detect.pt",
          )
          model=YOLO(source)
          exported=model.export(format="onnx",imgsz=640,opset=12,simplify=False,dynamic=False)
          target=Path("benchmark-model"); target.mkdir(exist_ok=True)
          shutil.copy2(exported,target/"floorcad.onnx")
          classes=[str(model.names[index]) for index in sorted(model.names)]
          (target/"classes.json").write_text(json.dumps(classes),encoding="utf-8")
          PY
      - name: Configure detector
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          classes=json.loads(Path("benchmark-model/classes.json").read_text())
          with Path(os.environ["GITHUB_ENV"]).open("a") as env:
              env.write("SYMBOL_ONNX_MODEL="+str(Path("benchmark-model/floorcad.onnx").resolve())+"\n")
              env.write("SYMBOL_ONNX_CLASSES="+json.dumps(classes,separators=(",",":"))+"\n")
              env.write("SYMBOL_ONNX_RAW_MIN_CONFIDENCE=0.30\n")
              env.write("SYMBOL_MIN_CONFIDENCE=0.55\n")
              env.write("PDF_NATIVE_TEXT_FASTPATH=1\n")
          PY
      - name: Analyze sheet
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: |
          mkdir -p "../../benchmark-output/vector-door-${{ matrix.shard }}"
          python -m app.aec_benchmark \
            --dataset ../../external/aec-geometric-bench/dataset \
            --output "../../benchmark-output/vector-door-${{ matrix.shard }}" \
            --offset "${{ matrix.shard }}" --limit 1
      - uses: actions/upload-artifact@v4
        with:
          name: vector-door-sheet-${{ matrix.shard }}-${{ github.sha }}
          path: |
            benchmark-output/vector-door-${{ matrix.shard }}/*.json
            benchmark-output/vector-door-${{ matrix.shard }}/_canonical/*.json
            benchmark-output/vector-door-${{ matrix.shard }}/_timings/*.json
          retention-days: 3

  score:
    if: always()
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/analyzer/requirements.txt shapely
      - uses: actions/download-artifact@v4
        with:
          pattern: vector-door-sheet-*-${{ github.sha }}
          path: benchmark-output/vector-door/predictions
          merge-multiple: true
      - name: Score vector doors
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from app.aec_benchmark import run_official_scorer
          root=Path("../..")
          pred=root/"benchmark-output/vector-door/predictions"
          dataset=root/"external/aec-geometric-bench/dataset"
          sheets=sorted(p.stem for p in pred.glob("sheet_*.json"))
          code,output,report=run_official_scorer(
              root/"external/aec-geometric-bench/scoring/score.py",
              pred,dataset,sheet_names=sheets,include_per_sheet=True,
          )
          target=root/"benchmark-output/vector-door"; target.mkdir(exist_ok=True)
          (target/"score.txt").write_text(output,encoding="utf-8")
          if report is not None:
              (target/"report.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
              single=report.get("classes",{}).get("Single Swing Door",{})
              double=report.get("classes",{}).get("Double Swing Door",{})
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
                  out.write("## Native PDF-vector door detector\n\n")
                  out.write(
                      f"- Single: TP {single.get('tp',0)} FP {single.get('fp',0)} "
                      f"FN {single.get('fn',0)} F1 {float(single.get('f1',0)):.3f}\n"
                  )
                  out.write(
                      f"- Double: TP {double.get('tp',0)} FP {double.get('fp',0)} "
                      f"FN {double.get('fn',0)} F1 {float(double.get('f1',0)):.3f}\n"
                  )
                  out.write(f"- Object micro F1: {float(report.get('objectMicro',{}).get('f1',0)):.3f}\n")
                  out.write(f"- macroF1: {float(report.get('macroF1',0)):.3f}\n")
          print(output)
          raise SystemExit(code)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vector-door-score-${{ github.sha }}
          path: |
            benchmark-output/vector-door/score.txt
            benchmark-output/vector-door/report.json
          if-no-files-found: warn
          retention-days: 7
