name: Secondary Sink Cooktop Rescue

on:
  push:
    branches: [exp/secondary-sink-cooktop-rescue]
    paths:
      - services/analyzer/app/symbols.py
      - services/analyzer/tests/test_symbols.py
      - .github/workflows/experiment-secondary-cooktop.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  prepare-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ultralytics==8.3.249" "huggingface_hub>=0.34,<1" "onnx>=1.17,<2"

      - name: Export FloorCAD primary detector
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          from ultralytics import YOLO

          source=hf_hub_download(
              "mudasir13cs/floorcad-yolov8n-detect",
              "floorcad-yolov8n-detect.pt",
          )
          model=YOLO(source)
          exported=model.export(
              format="onnx",
              imgsz=640,
              opset=12,
              simplify=False,
              dynamic=False,
          )
          target=Path("combined-model")
          target.mkdir(exist_ok=True)
          shutil.copy2(exported,target/"floorcad.onnx")
          classes=[str(model.names[index]) for index in sorted(model.names)]
          (target/"floorcad-classes.json").write_text(
              json.dumps(classes),
              encoding="utf-8",
          )
          PY

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35771807959
          name: synthetic-object-model-ce173f1610d70efb74b1c49c1c72ed137d04e57a
          path: secondary-artifact

      - name: Add long-trained secondary detector
        run: |
          cp secondary-artifact/synthetic-model/synthetic-objects.onnx combined-model/secondary.onnx
          cp secondary-artifact/synthetic-model/classes.json combined-model/secondary-classes.json

      - uses: actions/upload-artifact@v4
        with:
          name: combined-object-models-${{ github.sha }}
          path: combined-model/
          retention-days: 4

  benchmark:
    needs: prepare-models
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [4, 9, 13, 14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt

      - name: Install analyzer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          python -m pip install --upgrade pip
          pip install -r services/analyzer/requirements.txt pytest shapely

      - uses: actions/download-artifact@v4
        with:
          name: combined-object-models-${{ github.sha }}
          path: combined-model

      - name: Configure primary plus cooktop-only secondary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          root=Path("combined-model")
          primary=json.loads((root/"floorcad-classes.json").read_text())
          secondary=json.loads((root/"secondary-classes.json").read_text())
          with Path(os.environ["GITHUB_ENV"]).open("a") as env:
              env.write("SYMBOL_ONNX_MODEL="+str((root/"floorcad.onnx").resolve())+"\n")
              env.write("SYMBOL_ONNX_CLASSES="+json.dumps(primary,separators=(",",":"))+"\n")
              env.write("SYMBOL_ONNX_RAW_MIN_CONFIDENCE=0.10\n")
              env.write("SYMBOL_MIN_CONFIDENCE=0.55\n")
              env.write("SYMBOL_SINK_MIN_CONFIDENCE=0.10\n")
              env.write("OPENING_ONNX_MIN_CONFIDENCE=0.35\n")
              env.write("SYMBOL_SECONDARY_ONNX_MODEL="+str((root/"secondary.onnx").resolve())+"\n")
              env.write("SYMBOL_SECONDARY_ONNX_CLASSES="+json.dumps(secondary,separators=(",",":"))+"\n")
              env.write("SYMBOL_SECONDARY_ONNX_RAW_MIN_CONFIDENCE=0.50\n")
              env.write("SYMBOL_SECONDARY_ONNX_ALLOWED_CLASSES=sink,cooktop\n")
              env.write("SYMBOL_SECONDARY_ONNX_TILE_TRIGGER=1800\n")
              env.write("SYMBOL_SECONDARY_ONNX_TILE_SIZE=1600\n")
              env.write("SYMBOL_SECONDARY_ONNX_TILE_OVERLAP=0.18\n")
              env.write("SYMBOL_COOKTOP_MIN_CONFIDENCE=0.50\n")
              env.write("PDF_NATIVE_TEXT_FASTPATH=1\n")
          print("Primary classes",primary)
          print("Secondary classes",secondary)
          PY

      - name: Run representative AEC sheet
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: |
          mkdir -p "../../benchmark-output/cooktop-${{ matrix.shard }}"
          python -m app.aec_benchmark             --dataset ../../external/aec-geometric-bench/dataset             --output "../../benchmark-output/cooktop-${{ matrix.shard }}"             --offset "${{ matrix.shard }}"             --limit 1

      - uses: actions/upload-artifact@v4
        with:
          name: cooktop-sheet-${{ matrix.shard }}-${{ github.sha }}
          path: |
            benchmark-output/cooktop-${{ matrix.shard }}/*.json
            benchmark-output/cooktop-${{ matrix.shard }}/_canonical/*.json
            benchmark-output/cooktop-${{ matrix.shard }}/_timings/*.json
          if-no-files-found: error
          retention-days: 4

  score:
    if: always()
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/analyzer/requirements.txt shapely
      - uses: actions/download-artifact@v4
        with:
          pattern: cooktop-sheet-*-${{ github.sha }}
          path: benchmark-output/cooktop/predictions
          merge-multiple: true
      - name: Score combined detectors
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from app.aec_benchmark import run_official_scorer

          root=Path("../..")
          pred=root/"benchmark-output/cooktop/predictions"
          dataset=root/"external/aec-geometric-bench/dataset"
          scorer=root/"external/aec-geometric-bench/scoring/score.py"
          sheets=sorted(p.stem for p in pred.glob("sheet_*.json"))
          code,output,report=run_official_scorer(
              scorer,pred,dataset,sheet_names=sheets,include_per_sheet=True,
          )
          target=root/"benchmark-output/cooktop"
          target.mkdir(exist_ok=True)
          (target/"score.txt").write_text(output,encoding="utf-8")
          if report is not None:
              (target/"report.json").write_text(
                  json.dumps(report,indent=2),
                  encoding="utf-8",
              )
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
                  out.write("## FloorCAD + sink/cooktop secondary\n\n")
                  out.write("| Class | TP | FP | FN | F1 |\n|---|---:|---:|---:|---:|\n")
                  for cls in (
                      "Single Swing Door","Double Swing Door","Window","Sink",
                      "Toilet","Bathtub","Shower","Cooktops",
                  ):
                      item=report.get("classes",{}).get(cls,{})
                      out.write(
                          f"| {cls} | {item.get('tp',0)} | {item.get('fp',0)} | "
                          f"{item.get('fn',0)} | {float(item.get('f1',0)):.3f} |\n"
                      )
                  out.write(
                      f"\nObject micro F1: {float(report.get('objectMicro',{}).get('f1',0)):.3f}\n"
                  )
                  out.write(
                      f"macroF1: {float(report.get('macroF1',0)):.3f}\n"
                  )
          print(output)
          raise SystemExit(code)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cooktop-rescue-score-${{ github.sha }}
          path: |
            benchmark-output/cooktop/score.txt
            benchmark-output/cooktop/report.json
          if-no-files-found: warn
          retention-days: 6
