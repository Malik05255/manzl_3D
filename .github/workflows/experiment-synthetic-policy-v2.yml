name: Synthetic Detector Policy V2

on:
  push:
    branches: [exp/synthetic-object-detector-fast-v2]
    paths:
      - services/analyzer/app/symbols.py
      - services/analyzer/tests/test_symbols.py
      - .github/workflows/experiment-synthetic-policy-v2.yml
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [4, 9, 13, 14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analyzer/requirements.txt

      - name: Install analyzer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          python -m pip install --upgrade pip
          pip install -r services/analyzer/requirements.txt pytest shapely

      - name: Run symbol tests
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_symbols.py

      - name: Reuse trained synthetic model
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35772651346
          name: synthetic-object-model-3110e7f36bdee04e45278c7d2da5046fc8e83058
          path: synthetic-model-artifact

      - name: Configure detector with fixture-specific floors
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          classes=json.loads(
              Path("synthetic-model-artifact/synthetic-model/classes.json").read_text()
          )
          model=Path("synthetic-model-artifact/synthetic-model/synthetic-objects.onnx").resolve()
          with Path(os.environ["GITHUB_ENV"]).open("a") as env:
              env.write("SYMBOL_ONNX_MODEL="+str(model)+"\n")
              env.write("SYMBOL_ONNX_CLASSES="+json.dumps(classes,separators=(",",":"))+"\n")
              env.write("SYMBOL_ONNX_RAW_MIN_CONFIDENCE=0.05\n")
              env.write("SYMBOL_MIN_CONFIDENCE=0.55\n")
              env.write("SYMBOL_SINK_MIN_CONFIDENCE=0.08\n")
              env.write("SYMBOL_TOILET_MIN_CONFIDENCE=0.08\n")
              env.write("SYMBOL_BATHTUB_MIN_CONFIDENCE=0.08\n")
              env.write("SYMBOL_SHOWER_MIN_CONFIDENCE=0.08\n")
              env.write("SYMBOL_COOKTOP_MIN_CONFIDENCE=0.08\n")
              env.write("OPENING_ONNX_MIN_CONFIDENCE=0.10\n")
              env.write("PDF_NATIVE_TEXT_FASTPATH=1\n")
          print("classes",classes)
          PY

      - name: Run representative AEC sheet
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: |
          mkdir -p "../../benchmark-output/policy-v2-${{ matrix.shard }}"
          python -m app.aec_benchmark             --dataset ../../external/aec-geometric-bench/dataset             --output "../../benchmark-output/policy-v2-${{ matrix.shard }}"             --offset "${{ matrix.shard }}"             --limit 1

      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-policy-v2-sheet-${{ matrix.shard }}-${{ github.sha }}
          path: |
            benchmark-output/policy-v2-${{ matrix.shard }}/*.json
            benchmark-output/policy-v2-${{ matrix.shard }}/_canonical/*.json
            benchmark-output/policy-v2-${{ matrix.shard }}/_timings/*.json
          if-no-files-found: error
          retention-days: 4

  score:
    if: always()
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KamaiEnterprises/aec-geometric-bench
          ref: main
          path: external/aec-geometric-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/analyzer/requirements.txt shapely

      - uses: actions/download-artifact@v4
        with:
          pattern: synthetic-policy-v2-sheet-*-${{ github.sha }}
          path: benchmark-output/policy-v2/predictions
          merge-multiple: true

      - name: Score policy V2
        working-directory: services/analyzer
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from app.aec_benchmark import run_official_scorer

          root=Path("../..")
          pred=root/"benchmark-output/policy-v2/predictions"
          dataset=root/"external/aec-geometric-bench/dataset"
          scorer=root/"external/aec-geometric-bench/scoring/score.py"
          sheets=sorted(p.stem for p in pred.glob("sheet_*.json"))
          if not sheets:
              raise SystemExit("No predictions")
          code,output,report=run_official_scorer(
              scorer,pred,dataset,sheet_names=sheets,include_per_sheet=True,
          )
          target=root/"benchmark-output/policy-v2"
          target.mkdir(exist_ok=True)
          (target/"score.txt").write_text(output,encoding="utf-8")
          if report is not None:
              (target/"report.json").write_text(
                  json.dumps(report,ensure_ascii=False,indent=2),
                  encoding="utf-8",
              )
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
                  out.write("## Synthetic policy V2\n\n")
                  out.write("| Class | TP | FP | FN | F1 |\n|---|---:|---:|---:|---:|\n")
                  for cls in (
                      "Single Swing Door","Double Swing Door","Window","Sink",
                      "Toilet","Bathtub","Shower","Cooktops",
                  ):
                      item=report.get("classes",{}).get(cls,{})
                      out.write(
                          f"| {cls} | {item.get('tp',0)} | {item.get('fp',0)} | "
                          f"{item.get('fn',0)} | {float(item.get('f1',0)):.3f} |\n"
                      )
                  out.write(
                      f"\nObject micro F1: {float(report.get('objectMicro',{}).get('f1',0)):.3f}\n"
                  )
                  out.write(
                      f"macroF1: {float(report.get('macroF1',0)):.3f}\n"
                  )
          print(output)
          raise SystemExit(code)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-policy-v2-score-${{ github.sha }}
          path: |
            benchmark-output/policy-v2/score.txt
            benchmark-output/policy-v2/report.json
          if-no-files-found: warn
          retention-days: 7
